name: Nuxt DX budget

on:
  # A full production build, run only to measure one bundle. A docs-only change
  # moves nothing this workflow measures, so it skips itself.
  #
  # `*.md` is single-star on purpose: it matches root markdown only. Site
  # content lives in `content/`, which Nuxt Content reads at build time, so a
  # blanket `**.md` ignore would stop budgeting the markdown that counts.
  #
  # The list repeats because GitHub's workflow parser has no YAML anchors.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - .editorconfig
      - .gitignore
      - '.idea/**'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - .editorconfig
      - .gitignore
      - '.idea/**'
      - '.vscode/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  # the budget action comments the diff on the pull request
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          UNHEAD_DOCS_SOURCE: remote
      - uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@main
        with:
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
