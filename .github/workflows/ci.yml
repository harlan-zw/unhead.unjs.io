name: CI

# The pull request gate. Until now this repository had none: lint, typecheck, and
# test ran only inside deploy-cloudflare.yml, which fires after the merge, so a
# red branch was discovered by a failed production deploy.
#
# The jobs live in harlan-zw/harlan-nuxt so every site shares one pinned copy.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harlan-desktop:
    uses: harlan-zw/harlan-nuxt/.github/workflows/harlan-desktop-site-ci.yml@main
    with:
      # GitHub-hosted on purpose. This repository is public, and a self-hosted
      # runner on a public repository lets a fork pull request run code on the
      # workstation.
      runs-on: '["ubuntu-24.04-arm"]'
      # `postinstall` runs `nuxt prepare`, which typecheck and vitest both
      # resolve aliases through.
      install-args: ''
      # No `test:run` script here; `test` is already `vitest run`.
      test-command: pnpm test
      typecheck-node-options: --max-old-space-size=14000
      timeout-minutes: 30

  build:
    # Main builds in the deploy workflow. Keep the build check on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          UNHEAD_DOCS_SOURCE: remote
