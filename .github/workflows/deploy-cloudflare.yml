name: Deploy to Cloudflare

# Runs only after CI passes on main. Before, this workflow was the first thing to
# lint, typecheck, or test a commit, which meant a lint failure surfaced part-way
# into a production deploy. Those steps now live in ci.yml and are gone from here.
#
# `repository_dispatch` stays: a docs update in the unhead repository rebuilds
# this site against a commit CI has already passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Every trigger that reaches the deploy writes to the same Pages production
  # branch, so they must share one group or a dispatch and a CI deploy race onto
  # it. `cancel-in-progress: false` keeps an in-flight deploy intact; the next
  # run waits.
  group: deploy-cloudflare-${{ github.event.workflow_run.head_branch || github.ref_name }}
  # A deploy in flight must finish. Cancelling between the Pages upload and the
  # D1 content sync below leaves the site live against a half-written database.
  cancel-in-progress: false

jobs:
  deploy:
    # `github.sha` is the default branch tip for a `workflow_run` event, not the
    # commit the run covered, so it cannot be compared against `head_sha` and
    # cannot be checked out. Use `head_sha` throughout.
    #
    # The deploy now targets the Pages production branch directly (`--branch=main`
    # below), so every trigger must prove the commit it builds is main. A manual
    # dispatch on a feature branch would otherwise push that branch's build to
    # production and the verify step would bless it.
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@main
        with:
          install-args: ''

      - name: Cache for Nuxt SEO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-seo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'content.config.ts') }}
          restore-keys: |
            nuxt-seo-${{ runner.os }}-

      - run: pnpm build
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=14000
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_AI_READY_RUNTIME_SYNC_SECRET: ${{ secrets.NUXT_SEO_PRO_KEY }}
          NUXT_GITHUB_AUTH_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN }}
          NUXT_SEO_PRO_KEY: ${{ secrets.NUXT_SEO_PRO_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # `GITHUB_SHA` is the default branch tip on a `workflow_run` event, so
          # the release tag named a commit this build does not contain. Sentry
          # then blamed live errors on code that was never deployed.
          SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || github.sha }}
          UNHEAD_DOCS_SOURCE: remote

      # `wrangler pages deploy` uploads assets and the worker bundle only; it
      # never applies the built Wrangler config's `d1_databases` to the Pages
      # project. Create the database first, then attach `AI_READY_DB` to the
      # project config over the REST API. Both must happen before the upload,
      # or every aiReady write fails with `D1 binding "AI_READY_DB" not found`.
      - name: Ensure AI-ready D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-d1-database.mjs --name unhead-ai-ready

      - name: Attach AI_READY_DB to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node scripts/attach-pages-d1-binding.mjs
          --project unhead-unjs-io
          --database unhead-ai-ready
          --binding AI_READY_DB

      # `--branch` is required. Wrangler otherwise reads the branch from git, and
      # the checkout above is by SHA, which leaves a detached HEAD. Wrangler read
      # that as the branch `head` and uploaded every build as a preview.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler pages deploy dist
          --project-name=unhead-unjs-io
          --branch=main
          --commit-hash=${{ github.event.workflow_run.head_sha || github.sha }}

      # A green upload is not a deploy. Read the build manifest back from the
      # production hostname so a preview upload fails the job instead of leaving
      # merged fixes unreachable.
      - name: Verify production serves this build
        run: node scripts/verify-production-deploy.mjs --url https://unhead.unjs.io --max-age-minutes 30

      # Nuxt Content's lazy D1 import can exceed the request lifetime and leave
      # checksum rows at ready=false. Resume generated dumps after deploy, then
      # fail unless every expected content hash and checksum is present.
      - name: Sync and verify Nuxt Content D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-nuxt-content-d1.mjs --database unhead-unjs-io
