name: Deploy to Cloudflare

# Runs only after CI passes on main. Before, this workflow was the first thing to
# lint, typecheck, or test a commit, which meant a lint failure surfaced part-way
# into a production deploy. Those steps now live in ci.yml and are gone from here.
#
# `repository_dispatch` stays: a docs update in the unhead repository rebuilds
# this site against a commit CI has already passed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.event.workflow_run.head_branch || github.ref }}
  # A deploy in flight must finish. Cancelling between the Pages upload and the
  # D1 content sync below leaves the site live against a half-written database.
  cancel-in-progress: false

jobs:
  deploy:
    # `github.sha` is the default branch tip for a `workflow_run` event, not the
    # commit the run covered, so it cannot be compared against `head_sha` and
    # cannot be checked out. Use `head_sha` throughout.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: harlan-zw/harlan-nuxt/.github/actions/setup@main
        with:
          install-args: ''

      - name: Cache for Nuxt SEO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-seo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'content.config.ts') }}
          restore-keys: |
            nuxt-seo-${{ runner.os }}-

      - run: pnpm build
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=14000
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_AI_READY_RUNTIME_SYNC_SECRET: ${{ secrets.NUXT_SEO_PRO_KEY }}
          NUXT_GITHUB_SPONSORS_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN }}
          NUXT_SEO_PRO_KEY: ${{ secrets.NUXT_SEO_PRO_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          UNHEAD_DOCS_SOURCE: remote

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=unhead-unjs-io

      # Nuxt Content's lazy D1 import can exceed the request lifetime and leave
      # checksum rows at ready=false. Resume generated dumps after deploy, then
      # fail unless every expected content hash and checksum is present.
      - name: Sync and verify Nuxt Content D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-nuxt-content-d1.mjs --database unhead-unjs-io
