name: Deploy to Cloudflare

# Deploys directly on pushes to main because branch protection already enforces
# CI on pull requests. `repository_dispatch` rebuilds when upstream unhead docs
# change.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - README.md
      - AGENTS.md
  repository_dispatch:
    types: [docs-update]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Every trigger that reaches the deploy writes to the same Pages production
  # branch, so they must share one group or a dispatch and a push deploy race
  # onto it. `cancel-in-progress: false` keeps an in-flight deploy intact; the
  # next run waits.
  group: deploy-cloudflare-${{ github.ref_name }}
  # A deploy in flight must finish. Cancelling between the Pages upload and the
  # D1 content sync below leaves the site live against a half-written database.
  cancel-in-progress: false

jobs:
  deploy:
    # The deploy targets the Pages production branch directly (`--branch=main`
    # below), so every trigger must prove the commit it builds is main. A manual
    # dispatch on a feature branch would otherwise push that branch's build to
    # production and the verify step would bless it.
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@main
        with:
          node-version: 26.13.0
          install-args: ''

      - name: Cache for Nuxt SEO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-seo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'content.config.ts') }}
          restore-keys: |
            nuxt-seo-${{ runner.os }}-

      - run: pnpm build
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=14000
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_APP_SECRET: ${{ secrets.NUXT_APP_SECRET }}
          NUXT_GITHUB_AUTH_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN }}
          NUXT_SEO_PRO_KEY: ${{ secrets.NUXT_SEO_PRO_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
          NUXT_CHECKIN_DEPLOYMENT: ${{ github.sha }}
          UNHEAD_DOCS_SOURCE: remote

      # This upload uses Pages project settings without a Wrangler config.
      # Nitro reads runtime config from process.env. Enable it at the current Pages compatibility date.
      - name: Ensure AI-ready D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-d1-database.mjs --name unhead-ai-ready

      - name: Configure the Pages database and runtime secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node scripts/attach-pages-d1-binding.mjs
          --project unhead-unjs-io
          --database unhead-ai-ready
          --binding AI_READY_DB
          --compatibility-flag nodejs_compat_populate_process_env

      # Stop before upload if remote content queries or sync planning fail.
      # Keep this read-only while the previous build still serves the shared D1.
      - name: Check Nuxt Content D1 before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-nuxt-content-d1.mjs --database unhead-unjs-io --dry-run

      # `--branch` is required so Wrangler always deploys to the Pages
      # production branch even on detached checkouts. Run outside the checkout
      # so Wrangler reads the Pages project settings.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          pnpm exec wrangler --cwd="$RUNNER_TEMP" pages deploy "$GITHUB_WORKSPACE/dist" --no-bundle
          --project-name=unhead-unjs-io
          --branch=main
          --commit-hash=${{ github.sha }}

      # A green upload is not a deploy. Read the build manifest back from the
      # production hostname so a preview upload fails the job instead of leaving
      # merged fixes unreachable.
      - name: Verify production serves this build
        run: node scripts/verify-production-deploy.mjs --url https://unhead.unjs.io --max-age-minutes 30

      # Nuxt Content's lazy D1 import can exceed the request lifetime and leave
      # checksum rows at ready=false. Resume generated dumps after deploy, then
      # fail unless every expected content hash and checksum is present.
      - name: Sync and verify Nuxt Content D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-nuxt-content-d1.mjs --database unhead-unjs-io

      # A matching build manifest does not prove the pages render. Docs pages
      # answered 500 for 26 hours behind green deploys (#125). Request a few
      # docs pages on the production hostname and fail on any 5xx.
      - name: Check docs pages render
        run: node scripts/check-docs-pages.ts --url https://unhead.unjs.io

      # Reuse the deploy build. Reporting errors must not change deployment status.
      - name: Report Nuxt DX budget
        id: dx_budget
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@36d8fbf0dec7a829f63683abbf1fdc6efa2e6697
        with:
          artifact-name: nuxt-dx-size-budget-v3-prod
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
          comment: 'false'
      - name: Surface unavailable size report
        if: steps.dx_budget.outcome == 'failure'
        run: |
          echo '::warning::Nuxt DX reporting failed. See the report step.'
          echo '### Nuxt DX report unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reporting failed. The deployment result is unchanged.' >> "$GITHUB_STEP_SUMMARY"
